<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- seo -%}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
{%- feed_meta -%}
<style>
:root{--paper:#F1F2F4;--ink:#111418;--muted:#5A6170;--rule:#C9CDD6;--blue:#1E3FD8;--mark:#FFE14D;
  --sans:"Archivo",system-ui,-apple-system,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.page{max-width:720px;margin:0 auto;padding-inline:clamp(20px,5vw,40px)}
a{color:var(--blue)}
::selection{background:var(--mark);color:var(--ink)}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-weight:800;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:18px;border-bottom:1.5px solid var(--ink)}
.bar a{text-decoration:none;color:inherit}
.bar nav{display:flex;gap:20px}
.bar nav a{font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}
.bar nav a:hover{color:var(--blue)}
main{padding-block:clamp(32px,6vw,64px) 48px}
article img{max-width:100%;height:auto}
article blockquote{margin:1.5em 0;padding-left:18px;border-left:3px solid var(--mark)}
article pre{overflow-x:auto;background:#fff;padding:14px;border:1px solid var(--rule)}
article code{font-family:var(--mono);font-size:.9em}
.list{list-style:none;padding:0;margin:0}
.list li{padding-block:22px;border-bottom:1px solid var(--rule)}
.list h2{margin:6px 0 4px;font-size:1.5rem}
.list a{text-decoration:none;color:inherit}
.list a:hover h2{color:var(--blue)}
footer{padding-block:24px 40px;border-top:1.5px solid var(--ink)}
</style>
</head>
<body>
<div class="page">
  <header class="bar">
    <a href="{{ '/' | relative_url }}"><strong>{{ site.title }}</strong></a>
    <nav>
      <a href="{{ '/' | relative_url }}">Posts</a>
      <a href="https://bertamunoz02.github.io/">Sobre mí</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </header>

  <main>
    {%- if page.date %}
    <article>
      <p class="mono">{{ page.date | date: "%-d %B %Y" }}</p>
      <h1>{{ page.title }}</h1>
      {{ content }}
    </article>
    <p style="margin-top:48px"><a href="{{ '/' | relative_url }}">← Todos los posts</a></p>
    {%- else -%}
    {{ content }}
    {%- endif %}
  </main>

  <footer class="mono">
    © {{ 'now' | date: "%Y" }} {{ site.author }} ·
    <a href="mailto:bertamunoz02@gmail.com">bertamunoz02@gmail.com</a>
  </footer>
</div>
</body>
</html>
